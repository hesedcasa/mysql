name: Run end-to-end tests

permissions:
  contents: read

# On demand only. The suite stands up a MySQL container and runs two legs
# against it, so it is triggered manually rather than on every push and pull
# request.
on:
  workflow_dispatch:

jobs:
  run-e2e-tests:
    name: End-to-end tests against MySQL in Docker
    # Docker with the Compose plugin is preinstalled on the Ubuntu runners only.
    runs-on: ubuntu-latest
    # Two legs (standalone CLI, then the same suite via sdkck) at up to 1
    # minute per test.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          # Nothing here pushes; don't leave the token in .git/config for the
          # `npm ci` and build steps, which run repository code.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # The steps below are what `npm run test:e2e` does locally, split out so
      # the container is still around to dump logs from when a test fails.
      - name: Start MySQL
        run: npm run e2e:up

      - name: Build the CLI
        run: npm run build

      - name: Run end-to-end tests
        run: npm run e2e:mocha

      # Second leg: the same suite through the sdkck host CLI (pinned in
      # devDependencies, so `npm ci` above put it in node_modules) with this
      # build packed and installed as its @hesed/mysql plugin — covering the
      # `prepack` artifacts (oclif.manifest.json, README) and plugin dispatch
      # under a host. The plugin is installed before any `sdkck mysql` call so
      # sdkck's first-use auto-installer cannot fetch the published release
      # over this build. The throwaway sdkck home (mktemp -d) keeps the
      # install, config and caches out of the runner's real sdkck setup; the
      # test side finds it via E2E_SDKCK_HOME.
      - name: Pack the build and install it as an sdkck plugin
        run: |
          home="$(mktemp -d)"
          echo "E2E_SDKCK_HOME=$home" >> "$GITHUB_ENV"
          # A `file:` URL is required: sdkck resolves any bare path containing
          # a slash as a GitHub org/repo. Packing into the throwaway home
          # keeps the tarball out of the workspace.
          tgz="$(npm pack --pack-destination "$home" | tail -n 1)"
          SDKCK_CACHE_DIR="$home/cache" \
          SDKCK_CONFIG_DIR="$home/config" \
          SDKCK_DATA_DIR="$home/data" \
            ./node_modules/.bin/sdkck plugins install "file:$home/$tgz"

      - name: Run end-to-end tests via sdkck
        run: npm run e2e:mocha
        env:
          E2E_HOST_CLI: sdkck
          E2E_SDKCK_HOME: ${{ env.E2E_SDKCK_HOME }}

      - name: Dump MySQL container logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs mysql

      - name: Stop MySQL
        if: always()
        run: npm run e2e:down

  # Gating job for branch protection.
  e2e-test-success:
    name: '[Required] End-to-end tests passed'
    runs-on: ubuntu-latest
    needs: run-e2e-tests
    if: ${{ !cancelled() }}
    steps:
      - if: ${{ needs.run-e2e-tests.result != 'success' }}
        run: 'exit 1'
      - run: 'exit 0'
