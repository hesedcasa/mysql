# Local MySQL server for the end-to-end suite. Driven by scripts/e2e.sh.
#
#   docker compose -f docker/compose.yaml up -d --wait
#   docker compose -f docker/compose.yaml down -v
#
# Both the project name and the host port are overridable, so two runs can
# share a machine: MQ_E2E_PROJECT=mq-e2e-b MQ_E2E_PORT=13307 npm run test:e2e
name: ${MQ_E2E_PROJECT:-mq-e2e}

services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile
    image: mq-e2e-mysql:latest
    ports:
      # Host port is overridable so the container never fights a local MySQL.
      - '${MQ_E2E_PORT:-13306}:3306'
    tmpfs:
      # Data lives in RAM: fast startup, and every `up` is a clean database.
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 30
